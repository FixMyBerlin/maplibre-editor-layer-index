name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build package
        run: bun run build

      - name: Typecheck
        run: |
          bun run --filter @osm-editor-kit/maplibre-editor-layer-index typecheck
          bun run --filter preview typecheck

      - name: Size budget
        run: bun run --filter @osm-editor-kit/maplibre-editor-layer-index check-size

      - name: Test
        run: bun run test

      - name: Check exports (attw)
        run: bun run check-exports
