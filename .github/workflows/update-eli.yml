name: Update ELI data

on:
  schedule:
    # Weekly, Monday 06:17 UTC (off the :00 mark to avoid the cron stampede).
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Fetch + validate + transform. Fails the job on upstream schema drift,
      # so we never publish data we can't trust (handled by the failure step below).
      - name: Regenerate data
        run: bun run eli:build

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- packages/maplibre-editor-layer-index/src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ELI data unchanged — nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ELI data changed."
          fi

      # Same gates a PR gets before anything is published.
      - name: Lint, typecheck, test, check exports
        if: steps.diff.outputs.changed == 'true'
        run: |
          bun run lint
          bun run --filter @osm-editor-kit/maplibre-editor-layer-index typecheck
          bun run test
          bun run build
          bun run check-exports

      - name: Version, commit and publish
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > ".changeset/eli-auto-${{ github.run_id }}.md" <<'EOF'
          ---
          "@osm-editor-kit/maplibre-editor-layer-index": patch
          ---

          Update Editor Layer Index data (automated weekly refresh).
          EOF

          bun run version-packages
          git add -A
          git commit -m "chore: update Editor Layer Index data [skip ci]"
          git push

          bun run release

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly ELI update failed'
            const body = `The scheduled \`update-eli\` run failed — likely upstream schema drift or a publish error.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'eli-update-failure',
            })
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['eli-update-failure'],
              })
            }
